<body>
<header class="sticky top-0 z-10 border-b border-border bg-background/90 backdrop-blur">
  <div class="mx-auto max-w-6xl xl:max-w-[1320px] px-6">
    <div class="flex h-14 items-center justify-between">
      <div class="text-[15px] font-semibold tracking-tight">Hit Tracker</div>
      <div id="status" class="flex items-center gap-2 text-sm text-muted-foreground"><span class="h-1.5 w-1.5 rounded-full bg-take"></span><span>loading…</span></div>
    </div>
    <div class="pb-3">
      <div class="tabs-list w-full sm:w-auto grid grid-cols-5 sm:inline-flex" id="tabs">
        <button class="tabs-trigger px-1 sm:px-3" data-tab="live" data-state="active"><span class="sm:hidden">Live</span><span class="hidden sm:inline">Live</span> <span class="ml-1.5 text-xs text-muted-foreground hidden sm:inline" id="n-live">–</span></button>
        <button class="tabs-trigger px-1 sm:px-3" data-tab="board" data-state="inactive"><span class="sm:hidden">Board</span><span class="hidden sm:inline">Today's board</span> <span class="ml-1.5 text-xs text-muted-foreground hidden sm:inline" id="n-board">–</span></button>
        <button class="tabs-trigger px-1 sm:px-3" data-tab="move" data-state="inactive"><span class="sm:hidden">Lines</span><span class="hidden sm:inline">Line movement</span> <span class="ml-1.5 text-xs text-muted-foreground hidden sm:inline" id="n-move">–</span></button>
        <button class="tabs-trigger px-1 sm:px-3" data-tab="pitch" data-state="inactive"><span class="sm:hidden">Pitchers</span><span class="hidden sm:inline">Pitchers</span> <span class="ml-1.5 text-xs text-muted-foreground hidden sm:inline" id="n-pitch">–</span></button>
        <button class="tabs-trigger px-1 sm:px-3" data-tab="parlay" data-state="inactive"><span class="sm:hidden">Parlays</span><span class="hidden sm:inline">Live parlays</span> <span class="ml-1.5 text-xs text-muted-foreground hidden sm:inline" id="n-parlay">–</span></button>
      </div>
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl xl:max-w-[1320px] px-6 py-6 pb-24 space-y-6">
  <section id="live" class="on space-y-6">
    <div class="flex flex-wrap items-center gap-3">
      <input id="live-q" type="search" class="input max-w-xs" placeholder="Player or team">
      <div class="tabs-list w-full sm:w-auto grid grid-cols-4 sm:inline-flex" id="live-seg"><button class="tabs-trigger px-1 sm:px-3" data-f="targets" data-state="active">Targets</button><button class="tabs-trigger px-1 sm:px-3" data-f="hot" data-state="inactive">Hot bats</button><button class="tabs-trigger px-1 sm:px-3" data-f="streak" data-state="inactive">Streaks</button><button class="tabs-trigger px-1 sm:px-3" data-f="all" data-state="inactive">Everyone</button></div>
    </div>
    <div id="live-picks"></div>
    <div id="live-games" class="space-y-8"></div>
    <p id="live-note" class="text-sm text-muted-foreground"></p>
    <div id="key-live"></div>
  </section>

  <section id="board" class="space-y-6">
    <div class="flex flex-wrap items-center gap-3">
      <input id="board-q" type="search" class="input max-w-xs" placeholder="Player or team">
      <div class="tabs-list w-full sm:w-auto grid grid-cols-3 sm:inline-flex" id="board-seg"><button class="tabs-trigger" data-f="all" data-state="active">All</button><button class="tabs-trigger" data-f="take" data-state="inactive">Take</button><button class="tabs-trigger" data-f="streak" data-state="inactive">Streaks</button></div>
    </div>
    <div id="board-note"></div>
    <div id="board-picks"></div>
    <div id="board-games" class="space-y-8"></div>
    <div id="key-board"></div>
  </section>

    ].map(x => `<span class="block sm:inline">${x}</span>`).join('<span class="hidden sm:inline"> · </span>');
  };
  const leg = (x, i) => `<div class="flex items-center gap-4 border-b border-border px-5 py-3 last:border-0"><div class="w-5 text-sm text-muted-foreground">${i + 1}</div><div class="min-w-0 flex-1"><div class="flex items-center gap-2 text-[15px] font-semibold"><span class="shrink-0">${logo(x.r.team, 18)}</span><span class="truncate">${esc(x.r.player)}</span><span class="hidden sm:inline text-xs font-normal text-muted-foreground whitespace-nowrap">${x.r.hits} for ${x.r.ab} today${paWords(x.r) ? ` · ${paWords(x.r)}` : ''}</span></div><div class="sm:hidden text-[13px] text-muted-foreground">${x.r.hits} for ${x.r.ab} today${paWords(x.r) ? ` · ${paWords(x.r)}` : ''}</div><div class="text-[13px] text-muted-foreground leading-snug">${legLine(x)}</div></div><div class="text-right shrink-0"><div class="text-lg font-semibold text-take">${odds(x.r.odds)}</div><div class="text-xs text-muted-foreground">was ${odds(x.r.pre)}</div></div></div>`;
  let i = 0, legHtml = '';
  for (const [ev, xs] of groupBy(chosen, x => x.r.event)) {
    const t = teamsOf(ev), meta = DATA.live?.games?.[ev];
    const aA = meta?.away || abbrOf(t.away), hA = meta?.home || abbrOf(t.home);
    legHtml += `<div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1 bg-muted/40 px-5 py-2 text-[13px]"><span class="flex items-center gap-1.5 font-medium whitespace-nowrap">${logo(aA, 16)}${esc(nick(t.away))} <span class="text-muted-foreground">@</span> ${logo(hA, 16)}${esc(nick(t.home))}</span><span class="text-muted-foreground whitespace-nowrap">${esc(inningWords(meta?.inning || xs[0].r.inning))}${xs.length > 1 ? ` · ${xs.length} players from this game` : ''}</span></div>` + xs.map(x => leg(x, i++)).join('');
  }
  const alts = legs.filter(x => !chosen.includes(x)).slice(0, 4);
  $('#parlay-out').innerHTML = `<div class="card"><div class="flex flex-wrap items-baseline justify-between gap-2 px-5 pt-4 pb-3"><div class="text-[15px] font-semibold">${n} players</div><div class="text-sm text-muted-foreground">${sameTeam ? 'Two from one team because there were not enough teams' : sameGame ? 'One player per team · players from the same game are grouped' : 'One player per team'}</div></div><div class="border-t border-border">${legHtml}</div>${alts.length ? `<div class="border-t border-border px-5 py-3 text-sm text-muted-foreground"><span class="font-medium text-foreground">Next up:</span> ${alts.map(x => `${esc(x.r.player)} ${odds(x.r.odds)}, ${Math.round(x.m.p * 100)}%`).join(' · ')}</div>` : ''}</div>`;
}

/* ===== boot ===== */
async function refresh() {
  [DATA.live, DATA.report, DATA.board, DATA.move, DATA.pitch, DATA.status] = await Promise.all([get('data/live.json'), get('data/report.json'), get('data/board.json'), get('data/movement.json'), get('data/pitchers.json'), get('data/status.json')]);
  const st = DATA.status, checked = st?.checked || DATA.live?.generated || DATA.board?.generated;
  const limit = st?.live ? 10 : 45, stale = checked && (Date.now() - new Date(checked)) > limit * 60000;
  const changed = DATA.live?.rows?.length ? DATA.live.generated : DATA.board?.generated;
  $('#status').innerHTML = checked
    ? `<span class="h-1.5 w-1.5 rounded-full ${stale ? 'bg-risky' : 'bg-take'}"></span><span class="whitespace-nowrap">Checked ${ago(checked)}<span class="hidden md:inline">${st?.mode ? ` · checking ${st.mode}` : ''}${changed && changed !== checked ? ` · lines last changed ${ago(changed)}` : ''}</span></span>`
    : '<span class="h-1.5 w-1.5 rounded-full bg-risky"></span><span>No data yet</span>';
  for (const k of Object.keys(WX)) delete WX[k];
  for (const l of (DATA.board?.lines || [])) if (l.weather && l.event) WX[l.event] = l.weather;
  for (const g of (DATA.pitch?.games || [])) if (g.weather && g.event) WX[g.event] = g.weather;
  for (const [ev, gm] of Object.entries(DATA.live?.games || {})) if (gm?.weather) WX[ev] = gm.weather;   // MLB's own report wins for live games
  calibrate();
  renderLive(); renderBoard(); renderMove(); renderPitch(); renderParlay();
}
/* remember tab + filters across refreshes (per browser) */
const store = { get() { try { return JSON.parse(localStorage.getItem('ht-view') || '{}'); } catch { return {}; } }, set(v) { try { localStorage.setItem('ht-view', JSON.stringify(v)); } catch {} } };
function setActive(id, match) { document.querySelectorAll(id + ' button').forEach(x => x.dataset.state = match(x) ? 'active' : 'inactive'); }
function showTab(tab) { setActive('#tabs', x => x.dataset.tab === tab); document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id === tab)); }
function seg(id, key, fn) { document.querySelectorAll(id + ' button').forEach(b => b.onclick = () => { setActive(id, x => x === b); F[key] = b.dataset.f; store.set({ ...store.get(), [key]: b.dataset.f }); fn(); }); }
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { showTab(b.dataset.tab); store.set({ ...store.get(), tab: b.dataset.tab }); window.scrollTo(0, 0); });
seg('#live-seg', 'live', renderLive); seg('#board-seg', 'board', renderBoard); seg('#move-seg', 'move', renderMove); seg('#parlay-seg', 'parlay', renderParlay);
$('#live-q').oninput = renderLive; $('#board-q').oninput = renderBoard; $('#move-q').oninput = renderMove;
(function restore() {
  const v = store.get();
  for (const [key, id] of [['live', '#live-seg'], ['board', '#board-seg'], ['move', '#move-seg'], ['parlay', '#parlay-seg']])
    if (v[key] && document.querySelector(`${id} button[data-f="${v[key]}"]`)) { F[key] = v[key]; setActive(id, x => x.dataset.f === v[key]); }
  if (v.tab && document.querySelector(`#tabs button[data-tab="${v.tab}"]`)) showTab(v.tab);
})();
refresh(); setInterval(refresh, 60000);
</script>
</body>
